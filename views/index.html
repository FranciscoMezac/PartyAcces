<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>PartyAccess — Bienvenido</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap SOLO CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tus estilos globales -->
  <link rel="stylesheet" href="/public/css/styles.css">
</head>
<body class="landing-body">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">PartyAccess</a>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav"></div>
  </div>
</nav>


  <!-- Hero -->
<main class="landing-fill">
  <!-- HERO: blanco a pantalla completa (menos header/footer) -->
<section class="landing-hero py-5">
  <div class="container">
    <div class="row align-items-start gy-4">
      <!-- IZQUIERDA: card con botones (alto natural) -->
      <div class="col-12 col-lg-6">
        <div class="landing-card p-4 shadow-sm" id="heroCard">
          <h1 class="display-5 fw-bold mb-3">Bienvenidos</h1>
          <p class="lead text-secondary mb-4">
            Ingresa, acumula puntos por consumo con un QR y obtén recomendaciones personalizadas.
            ¡Todo en una sola plataforma diseñada para tus clubes favoritos!
          </p>
          <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-primary btn-lg" href="/login">Iniciar sesión</a>
            <a class="btn btn-outline-secondary btn-lg" href="/register">Crear cuenta</a>
          </div>
          <p class="small text-muted mt-3 mb-0">Para entrar al Home se requiere sesión iniciada.</p>
        </div>
      </div>

      <!-- DERECHA: carrusel (capado por la altura de la card) -->
      <div class="col-12 col-lg-6">
        <div class="landing-carousel" id="heroCarousel">
          <div id="carouselExample" class="carousel slide" data-autoplay="true" data-interval="4000">
            <div class="carousel-inner">
              <div class="carousel-item active">
                <img src="/public/img/Heaven_inside.jpg" class="d-block w-100" alt="Ambiente del club">
              </div>
              <div class="carousel-item">
                <img src="/public/img/Heaven_logo.jpg" class="d-block w-100" alt="Logo del club">
              </div>
            </div>
            <button class="carousel-control-prev" type="button" aria-label="Anterior">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            </button>
            <button class="carousel-control-next" type="button" aria-label="Siguiente">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

</main>

<nav class="bottom-nav">
  <div class="container py-4 text-center text-white">
    Club Heaven · PartyAccess
  </div>
</nav>

  <!-- JS propio mínimo (sin Bootstrap JS) -->
  <script src="/public/js/base.js"></script>
</body>
</html>
