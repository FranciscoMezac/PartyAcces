<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historial de Transacciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/public/css/styles.css" />
  <style>
    :root {
      --bg: #f7f8fb;
      --primary: #5a3be7;
      --text: #111827;
      --muted: #6b7280;
      --card: #fff;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }
    header {
      margin-bottom: 32px;
    }
    header h1 {
      margin: 0 0 8px 0;
      font-size: 2rem;
    }
    header p {
      margin: 4px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }
    .panel {
      background: var(--card);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 18px 45px rgba(15,23,42,.08);
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
    }
    .toolbar label {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 600;
    }
    input {
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.2s;
    }
    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(90, 59, 231, 0.1);
    }
    button {
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 1rem;
      background: var(--primary);
      color: #fff;
    }
    button:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    a:hover {
      opacity: 0.8;
    }
    .meta {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 16px;
      font-weight: 500;
    }
    .table-wrapper {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 24px;
    }
    thead {
      background: rgba(90, 59, 231, 0.05);
    }
    th {
      padding: 14px 16px;
      text-align: left;
      font-weight: 600;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    tbody tr:hover {
      background: rgba(90, 59, 231, 0.02);
    }
    tbody tr:last-child td {
      border-bottom: none;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }
    .empty-state p {
      margin: 8px 0 0;
    }
    .pager {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
    }
    .pager button {
      padding: 10px 20px;
      font-size: 0.95rem;
    }
    .pager-info {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .muted {
      color: var(--muted);
    }
    @media (max-width: 640px) {
      .page {
        padding: 20px 12px 60px;
      }
      .panel {
        padding: 20px;
      }
      .toolbar {
        gap: 8px;
      }
      input, button {
        font-size: 16px;
        padding: 10px 12px;
      }
      th, td {
        padding: 10px 8px;
        font-size: 0.85rem;
      }
      header h1 {
        font-size: 1.5rem;
      }
    }
  </style>
  <script defer src="/public/js/historial.js"></script>
</head>
<body>
  <div class="page">
    <header>
      <h1>Historial de Transacciones</h1>
      <p>Visualiza todas las transacciones de puntos asociadas a un cliente. Ingresa el RUT para ver el historial completo con detalles de cada movimiento.</p>
    </header>

    <section class="panel">
      <div class="toolbar">
        <label for="rut">RUT del Cliente</label>
        <input 
          id="rut" 
          placeholder="12.345.678-9" 
          aria-label="RUT del cliente"
        />
        <button id="btn-buscar" type="button">Buscar Historial</button>
        <a href="/dashboard" style="margin-left: auto;">← Volver</a>
      </div>

      <div class="meta" id="meta"></div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Tipo de Transacción</th>
              <th>Monto</th>
              <th>Puntos</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr>
              <td colspan="4" class="empty-state">
                <p class="muted">Ingresa un RUT y pulsa "Buscar Historial" para ver las transacciones.</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="pager">
        <button id="prev" type="button" disabled>← Anterior</button>
        <span class="pager-info" id="pager-info"></span>
        <button id="next" type="button" disabled>Siguiente →</button>
      </div>
    </section>
  </div>
</body>
</html>
