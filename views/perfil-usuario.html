<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - PartyAccess</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/styles.css">
</head>
<body>
    <!-- Navbar superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/home-usuario">PartyAccess</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">Cerrar Sesion</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h2 class="mb-4">Mi Perfil</h2>
                
                <!-- Card con información del usuario -->
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Informacion Personal</h5>
                        <a href="/editar-perfil" class="btn btn-light btn-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293l6.5-6.5zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/>
                            </svg>
                            Editar
                        </a>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-12 col-md-6 mb-3">
                                <label class="form-label fw-bold">Nombre:</label>
                                <p id="userName" class="form-control-plaintext">Cargando...</p>
                            </div>
                            <div class="col-12 col-md-6 mb-3">
                                <label class="form-label fw-bold">RUT:</label>
                                <p id="userRut" class="form-control-plaintext">Cargando...</p>
                            </div>
                            <div class="col-12 col-md-6 mb-3">
                                <label class="form-label fw-bold">Email:</label>
                                <p id="userEmail" class="form-control-plaintext">Cargando...</p>
                            </div>
                            <div class="col-12 col-md-6 mb-3">
                                <label class="form-label fw-bold">Rol:</label>
                                <p id="userRol" class="form-control-plaintext">Cargando...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Card con puntos (si aplica) -->
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Mis Puntos</h5>
                    </div>
                    <div class="card-body text-center">
                        <h1 id="userPoints" class="display-4">0</h1>
                        <p class="text-muted">Puntos acumulados</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="nav-container" id="bottomNavContainer">
      <a href="/home-usuario" class="nav-item">
        <div class="nav-icon"><span class="icon-emoji">🏠</span></div>
        <span class="nav-label">Inicio</span>
      </a>
      <a href="/qr" class="nav-item">
        <div class="nav-icon"><span class="icon-emoji">📱</span></div>
        <span class="nav-label">QR</span>
      </a>
      <a href="/perfil-usuario" class="nav-item active">
        <div class="nav-icon"><span class="icon-emoji">👤</span></div>
        <span class="nav-label">Usuario</span>
      </a>
    </div>
  </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/public/js/perfil-usuario.js"></script>
</body>
</html>
