<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PartyAccess - Inicio (Admin)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/public/css/styles.css">
</head>
<body>
  <!-- Navbar superior (Admin con link a Dashboard) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">PartyAccess</a>

      <button class="navbar-toggler" type="button" id="navToggle" aria-controls="navbarNav" aria-expanded="false" aria-label="Menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido principal -->
  <main class="container">
    <div class="row mt-5">
      <div class="col-12">
        <!-- Hero -->
        <div class="hero-section text-center mb-5">
          <h1 class="display-4">Panel de Administración</h1>
          <p class="lead">Gestiona eventos, accesos y métricas en tiempo real.</p>
          <p class="text-muted">Administra el flujo en puerta, promociones y reportes del club.</p>
        </div>

        <!-- Acciones admin -->
        <div class="text-center mb-5">
          <a class="btn btn-primary btn-lg me-2" href="/dashboard">Ir al Dashboard</a>
          <a class="btn btn-outline-secondary btn-lg" href="/qr">Ver QR de prueba</a>
        </div>

        <!-- Bloques resumen (diseño) -->
        <div class="row g-3">
          <div class="col-12 col-md-4">
            <div class="card shadow-sm">
              <div class="card-body">
                <h6 class="text-muted">Invitados hoy</h6>
                <div class="display-6">248</div>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-4">
            <div class="card shadow-sm">
              <div class="card-body">
                <h6 class="text-muted">Check-ins</h6>
                <div class="display-6">193</div>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-4">
            <div class="card shadow-sm">
              <div class="card-body">
                <h6 class="text-muted">Promos vendidas</h6>
                <div class="display-6">57</div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Bottom Navigation (admin con Dashboard) -->
  <nav class="bottom-nav">
    <div class="nav-container">
      <a href="/home-admin" class="nav-item active">
        <div class="nav-icon"><span class="icon-emoji">🏠</span></div>
        <span class="nav-label">Inicio</span>
      </a>
      <a href="/dashboard" class="nav-item">
        <div class="nav-icon"><span class="icon-emoji">📊</span></div>
        <span class="nav-label">Dashboard</span>
      </a>
      <a href="/qr" class="nav-item">
        <div class="nav-icon"><span class="icon-emoji">📱</span></div>
        <span class="nav-label">QR</span>
      </a>
      <a href="/usuario" class="nav-item">
        <div class="nav-icon"><span class="icon-emoji">👤</span></div>
        <span class="nav-label">Usuario</span>
      </a>
    </div>
  </nav>

  <!-- JS vanilla para el toggler del navbar superior -->
  <script src="/public/js/nav-toggle.js"></script>
</body>
</html>
