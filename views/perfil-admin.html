<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - PartyAccess</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/styles.css">
</head>
<body>
    <!-- Navbar superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/home-admin">PartyAccess - Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">Cerrar Sesion</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h2 class="mb-4">Panel de Administrador</h2>
                
                <!-- Card con información del admin -->
                <div class="card mb-4">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0">Informacion del Administrador</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-12 col-md-6 mb-3">
                                <label class="form-label fw-bold">Nombre:</label>
                                <p id="adminName" class="form-control-plaintext">Cargando...</p>
                            </div>
                            <div class="col-12 col-md-6 mb-3">
                                <label class="form-label fw-bold">RUT:</label>
                                <p id="adminRut" class="form-control-plaintext">Cargando...</p>
                            </div>
                            <div class="col-12 col-md-6 mb-3">
                                <label class="form-label fw-bold">Email:</label>
                                <p id="adminEmail" class="form-control-plaintext">Cargando...</p>
                            </div>
                            <div class="col-12 col-md-6 mb-3">
                                <label class="form-label fw-bold">Rol:</label>
                                <p id="adminRol" class="form-control-plaintext badge bg-danger">ADMIN</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Cards de acciones rapidas -->
                <div class="row">
                    <div class="col-12 col-md-4 mb-3">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5 class="card-title">Usuarios</h5>
                                <p class="card-text">Gestionar usuarios del sistema</p>
                                <a href="/dashboard" class="btn btn-primary btn-sm">Ver Usuarios</a>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-md-4 mb-3">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5 class="card-title">Puntos</h5>
                                <p class="card-text">Administrar puntos</p>
                                <button class="btn btn-secondary btn-sm" disabled>Proximamente</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-md-4 mb-3">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5 class="card-title">Reportes</h5>
                                <p class="card-text">Ver estadisticas</p>
                                <button class="btn btn-secondary btn-sm" disabled>Proximamente</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="nav-container">
      <a href="/home-admin" class="nav-item">
        <div class="nav-icon"><span class="icon-emoji">🏠</span></div>
        <span class="nav-label">Inicio</span>
      </a>
      <a href="/dashboard" class="nav-item">
        <div class="nav-icon"><span class="icon-emoji">📊</span></div>
        <span class="nav-label">Dashboard</span>
      </a>
      <a href="/qr" class="nav-item">
        <div class="nav-icon"><span class="icon-emoji">📱</span></div>
        <span class="nav-label">QR</span>
      </a>
      <a href="/perfil-admin" class="nav-item active">
        <div class="nav-icon"><span class="icon-emoji">👤</span></div>
        <span class="nav-label">Usuario</span>
      </a>
    </div>
  </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/public/js/perfil-admin.js"></script>
</body>
</html>
