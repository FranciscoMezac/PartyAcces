<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PartyAccess - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">PartyAccess</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/login">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/dashboard">Dashboard</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <h1>Dashboard</h1>
                <hr>
            </div>
        </div>
        <!-- Saldo en tiempo real -->
        <div class="card mb-3">
            <div class="card-body d-flex align-items-center gap-3">
                <div>
                    <label for="saldoRut" class="form-label">RUT para saldo</label>
                    <input id="saldoRut" class="form-control" placeholder="12.345.678-9" style="min-width:220px" />
                </div>
                <button class="btn btn-outline-primary" id="saldoBtn">Ver saldo</button>
                <div class="ms-auto">
                    <span class="text-muted">Saldo:</span>
                    <strong id="saldoValor">—</strong>
                    <span class="badge bg-light text-dark" id="saldoStatus">sin suscripción</span>
                </div>
            </div>
        </div>

        <div class="row mb-3 g-2 align-items-end">
            <div class="col-md-2">
                <label for="search" class="form-label">Buscar</label>
                <input id="search" class="form-control" placeholder="nombre, email o RUT" />
            </div>
            <div class="col-md-2">
                <label for="estado" class="form-label">Estado</label>
                <select id="estado" class="form-select">
                    <option value="all">Todos</option>
                    <option value="ACTIVO">ACTIVO</option>
                    <option value="BLOQUEADO">BLOQUEADO</option>
                </select>
            </div>
            <div class="col-md-2">
                <label for="limit" class="form-label">Por página</label>
                <select id="limit" class="form-select">
                    <option>5</option>
                    <option selected>10</option>
                    <option>20</option>
                </select>
            </div>
            <div class="col-md-6">
                <button class="btn btn-primary" id="loadUsersBtn">Cargar Usuarios</button>
                <a class="btn btn-outline-secondary ms-2" href="/puntos/acumular">Acumular puntos</a>
                <a class="btn btn-outline-success ms-2" href="/puntos/canjear">Canjear puntos</a>
                <a class="btn btn-outline-info ms-2" href="/puntos/historial">Ver historial</a>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Lista de Usuarios</h5>
                    </div>
                    <div class="card-body">
                        <div id="loading" class="text-center d-none">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Cargando...</span>
                            </div>
                        </div>
                        
                        <div id="alert-container"></div>
                        
                        <div id="usersTable" class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>Email</th>
                                        <th>RUT</th>
                                        <th>Rol</th>
                                        <th>Estado</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="usersTableBody">
                                    <tr>
                                        <td colspan="7" class="text-center text-muted">
                                            Haz clic en "Cargar Usuarios" para ver los datos
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <div class="d-flex justify-content-between align-items-center mt-2">
                                <div id="usersPageInfo" class="text-muted"></div>
                                <div>
                                    <button class="btn btn-sm btn-outline-secondary" id="prevUsers">Anterior</button>
                                    <button class="btn btn-sm btn-outline-secondary" id="nextUsers">Siguiente</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/public/js/dashboard.js"></script>
</body>
</html>
