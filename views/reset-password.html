<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resetear Contraseña - PartyAccess</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/styles.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Resetear Contraseña</h2>
                        
                        <div id="alertContainer"></div>

                        <form id="resetForm">
                            <div class="mb-3">
                                <label for="rut" class="form-label">RUT</label>
                                <input 
                                    type="text" 
                                    class="form-control" 
                                    id="rut" 
                                    name="rut" 
                                    placeholder="12345678-9"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="nuevaContrasena" class="form-label">Nueva Contraseña</label>
                                <input 
                                    type="password" 
                                    class="form-control" 
                                    id="nuevaContrasena" 
                                    name="nuevaContrasena" 
                                    placeholder="Mínimo 8 caracteres"
                                    required
                                    minlength="8"
                                >
                            </div>

                            <div class="mb-3">
                                <label for="confirmarContrasena" class="form-label">Confirmar Contraseña</label>
                                <input 
                                    type="password" 
                                    class="form-control" 
                                    id="confirmarContrasena" 
                                    name="confirmarContrasena" 
                                    placeholder="Repite la contraseña"
                                    required
                                    minlength="8"
                                >
                            </div>

                            <button type="submit" class="btn btn-primary w-100" id="resetBtn">
                                Resetear Contraseña
                            </button>
                        </form>

                        <div class="text-center mt-3">
                            <a href="/login" class="text-decoration-none">Volver al Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/public/js/reset-password.js"></script>
</body>
</html>
