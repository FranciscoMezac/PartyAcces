<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acumulación de Puntos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/public/css/styles.css" />
  <style>
    :root {
      --bg: #f7f8fb;
      --primary: #5a3be7;
      --text: #111827;
      --muted: #6b7280;
      --card: #fff;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .page {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }
    header {
      margin-bottom: 32px;
    }
    header h1 {
      margin: 0 0 8px 0;
      font-size: 2rem;
    }
    header p {
      margin: 4px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }
    .panel {
      background: var(--card);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 18px 45px rgba(15,23,42,.08);
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      font-weight: 600;
      color: var(--text);
      font-size: 0.95rem;
    }
    input {
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.2s;
    }
    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(90, 59, 231, 0.1);
    }
    .form-actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }
    button {
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 1rem;
    }
    button.primary {
      background: var(--primary);
      color: #fff;
    }
    button.primary:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
    button.secondary {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--border);
    }
    button.secondary:hover {
      background: rgba(90, 59, 231, 0.05);
    }
    .status {
      display: none;
      padding: 14px 16px;
      border-radius: 12px;
      margin-top: 16px;
      font-weight: 500;
    }
    .status.show { display: block; }
    .status.ok {
      background: #e7f6ec;
      color: #0f6848;
    }
    .status.err {
      background: #fdecea;
      color: #a42a26;
    }
    .muted {
      color: var(--muted);
      font-size: 0.9rem;
    }
    a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    a:hover {
      opacity: 0.8;
    }
  </style>
  <script defer src="/public/js/puntos.js"></script>
</head>
<body>
  <div class="page">
    <header>
      <h1>Acumulación de Puntos</h1>
      <p>Registra una compra e incrementa los puntos del cliente automáticamente. Ingresa el RUT del cliente y el monto de la transacción.</p>
    </header>

    <section class="panel">
      <form id="form-acumular">
        <div class="form-group">
          <label for="rut">RUT del Cliente</label>
          <input 
            id="rut" 
            name="rut" 
            placeholder="12.345.678-9" 
            required 
            aria-label="RUT del cliente"
          />
          <p class="muted">Formato: 12.345.678-9</p>
        </div>

        <div class="form-group">
          <label for="monto">Monto de la Compra</label>
          <input 
            id="monto" 
            name="monto" 
            type="number" 
            min="1" 
            step="1" 
            placeholder="25000" 
            required 
            aria-label="Monto de la compra"
          />
          <p class="muted">Ingresa solo números enteros (sin puntos ni signos)</p>
        </div>

        <div class="form-actions">
          <button type="submit" class="primary">Acreditar Puntos</button>
          <a href="/dashboard" class="secondary" style="padding: 12px 24px; border-radius: 12px; border: 1px solid var(--border); display: inline-block;">← Volver</a>
        </div>
      </form>

      <div id="resultado" class="status"></div>
    </section>
  </div>
</body>
</html>
