<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PartyAccess - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/styles.css">
</head>
<body>
    <!-- Navbar superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">PartyAccess</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">Dashboard</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="container">
        <div class="row mt-5">
            <div class="col-12">
                <!-- Hero Section -->
                <div class="hero-section text-center mb-5">
                    <h1 id="heroTitle" class="display-4">Bienvenido a PartyAccess</h1>
                    <p id="heroHeadline" class="lead">Cargando...</p>
                    <p id="heroSubheadline" class="text-muted">Cargando...</p>
                </div>

                <!-- Actions -->
                <div id="actionsContainer" class="text-center mb-5">
                    <!-- Los botones se cargarán dinámicamente -->
                </div>

                <!-- Contenido adicional -->
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Gestión de Eventos</h5>
                        <p class="card-text">
                            Administra tus eventos de forma simple. Control de invitados, 
                            check-in en puerta y métricas en tiempo real.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation (Navegación inferior) -->
    <nav class="bottom-nav">
        <div class="nav-container" id="bottomNavContainer">
            <!-- Los items de navegación se cargarán dinámicamente -->
        </div>
    </nav>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript vanilla para la navegación -->
    <script src="/public/js/navigation.js"></script>
</body>
</html>
